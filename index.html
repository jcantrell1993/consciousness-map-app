/* ═══ BOOT / POWER-ON ═══ */
.boot-stage {
  position: fixed;
  inset: 0;
  z-index: 5;
  /* No user scrolling: the script keeps the newest line in view, like a terminal */
  overflow: hidden;
  overflow-anchor: none;
  transform-origin: 50% 50%;
}

/* The beam draws a line across the middle, then the line opens into the screen */
.crt-beam {
  position: fixed;
  left: 0;
  right: 0;
  top: 50%;
  height: 2px;
  margin-top: -1px;
  z-index: 6;
  pointer-events: none;
  background: linear-gradient(90deg, transparent, #c6ffc9 18%, #f4fff5 50%, #c6ffc9 82%, transparent);
  box-shadow: 0 0 12px 2px #33ff33, 0 0 40px 8px #33ff3355;
  animation: crt-beam 1s ease-out both;
}

.crt-open {
  animation: crt-open .55s cubic-bezier(.2, .7, .2, 1) .42s both;
}

.crt-off {
  animation: crt-off .3s cubic-bezier(.6, 0, .9, .4) both;
}

/* The app arrives from the dark (opacity only: a filter here would trap fixed overlays) */
.crt-wake {
  animation: crt-wake .6s ease-out backwards;
}

@keyframes crt-beam {
  0% { transform: scaleX(0); opacity: 1; }
  38% { transform: scaleX(1); opacity: 1; }
  62% { transform: scaleX(1); opacity: 1; }
  100% { transform: scaleX(1); opacity: 0; }
}

@keyframes crt-open {
  0% { transform: scaleY(.006); filter: brightness(2.6); opacity: 0; }
  12% { opacity: 1; }
  100% { transform: scaleY(1); filter: brightness(1); opacity: 1; }
}

@keyframes crt-off {
  0% { transform: scaleY(1); filter: brightness(1); opacity: 1; }
  70% { transform: scaleY(.006); filter: brightness(2.6); opacity: 1; }
  100% { transform: scaleY(.006) scaleX(.02); filter: brightness(2.6); opacity: 0; }
}

@keyframes crt-wake {
  0% { opacity: 0; }
  100% { opacity: 1; }
}

/* Standby: a single LED breathing slowly in the dark */
.boot-led {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: #33ff33;
  box-shadow: 0 0 10px 2px #33ff3388;
  animation: boot-breathe 4.2s ease-in-out infinite;
}

.boot-hint {
  animation: boot-hint 3.6s ease-in-out infinite;
}

@keyframes boot-breathe {
  0%, 100% { opacity: .18; }
  50% { opacity: .9; }
}

@keyframes boot-hint {
  0%, 100% { opacity: .35; }
  50% { opacity: .85; }
}

.boot-caret {
  display: inline-block;
  width: .55em;
  height: 1.05em;
  margin-left: 2px;
  vertical-align: -.15em;
  background: #33ff33;
  box-shadow: 0 0 8px #33ff33;
}

/* The prompt's cursor is a tall slab, 1:4 */
.boot-monolith {
  display: inline-block;
  width: .36em;
  height: 1.44em;
  margin-left: .6em;
  vertical-align: -.3em;
  background: #33ff33;
  box-shadow: 0 0 8px #33ff33, 0 0 18px #33ff3388;
  animation: boot-monolith 1.4s steps(1) infinite;
}

@keyframes boot-monolith {
  0% { opacity: 1; }
  62% { opacity: 0; }
}

.boot-skip {
  position: fixed;
  right: 18px;
  bottom: 14px;
  z-index: 7;
  pointer-events: none;
  font-size: 11px;
  letter-spacing: .22em;
  color: rgba(51, 255, 51, .35);
}

@media (max-width: 559px) {
  .boot-hex { display: none; }
}

@media (prefers-reduced-motion: reduce) {
  .crt-beam, .crt-open, .crt-off, .crt-wake, .boot-led, .boot-hint, .boot-monolith {
    animation: none !important;
  }
  .crt-beam { display: none; }
}

@media (max-width: 639px) {
  /* Reduce padding on main containers */
  .min-h-screen.p-8 { padding: 1rem !important; }

  /* Scale down ASCII logo to fit mobile screens */
  pre.glow {
    font-size: 7px !important;
    line-height: 1.1 !important;
    letter-spacing: -0.5px;
  }

  /* Reduce main content padding */
  .max-w-3xl.mx-auto.px-6 { padding-left: 0.75rem !important; padding-right: 0.75rem !important; }

  /* Make waveform and phase bar text smaller so chars fit */
  .glow-subtle > div { font-size: 10px !important; letter-spacing: 0px !important; }

  /* Touch-friendly buttons — bigger tap targets */
  button { min-height: 48px !important; padding: 0.4rem 0.6rem !important; font-size: 13px !important; }

  /* Wider range slider thumb for touch */
  input[type="range"]::-webkit-slider-thumb { width: 18px !important; height: 28px !important; }
  input[type="range"]::-moz-range-thumb { width: 18px !important; height: 28px !important; }
  input[type="range"] { height: 6px !important; }

  /* Tighter gaps in flex-wrap rows */
  .flex.flex-wrap.gap-x-6 { gap: 0.5rem 0.75rem !important; }

  /* Ensure status line wraps cleanly */
  .flex.flex-wrap.gap-x-6.gap-y-1 span { font-size: 12px !important; }

  /* Reduce subtitle and quote text */
  .pulse-text { font-size: 11px !important; letter-spacing: 0.08em !important; }
}

  pre.glow { font-size: 5.5px !important; }
